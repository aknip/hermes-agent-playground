# company/cadence.yaml — die Kadenz-Limits der ESF
#
# Bei der Projektinitialisierung festgelegt, mit der ersten Roadmap vom CEO
# freigegeben. Die Kadenz ist INHALTSGETRIEBEN: Jede Ebene ist über die Anzahl
# ihrer Elemente limitiert, nicht über den Kalender, und schließt ab, sobald ihr
# Inhalt fertig ist. Solange Hermes läuft, arbeitet die Organisation bis zum
# Rand ihres Autonomie-Horizonts durch — unabhängig von Wochentag oder Uhrzeit.
#
# Diese Datei ist für jedes planende Profil verbindlich. Ein Limit, das ein
# Modell "im Kopf" hat, gilt nicht; es gilt, was hier steht.

# --- Mengen-Limits der vier Ebenen ------------------------------------------
releases_pro_quartal: 3
sprints_pro_release: 4          # Plan · Umsetzung · Umsetzung · Härtung
features_pro_release: 5
karten_pro_feature: 8           # Deckel für den Planungsgraphen je Feature

# --- Wie weit die Organisation ohne den CEO läuft ---------------------------
# release (Default): vollautomatisch bis zum Abschluss des aktuellen Release;
#                    dort blockiert das Release-Gate.
# quartal:           nur auf explizite Anweisung am Roadmap-Gate
#                    (unblock --reason "approve horizont: quartal"). Dann laufen
#                    alle drei Releases durch, die inneren Release-Gates werden
#                    zu nicht-blockierenden Update-Infos. Das Mandat erlischt
#                    mit dem Quartals-Gate.
autonomie_horizont: release

# --- Aufmerksamkeits-Deckel -------------------------------------------------
# Die knappe Ressource ist die Aufmerksamkeit des CEO, nicht das Token-Budget.
# Ein Gate mit zwölf wartenden Karten wird nicht sorgfältiger beantwortet,
# sondern durchgewinkt.
gate_fragen_pro_tag: 3

# --- Rubrik für die Signalbewertung (esf-market-analyst) --------------------
# Score = Summe der gewichteten Dimensionen, 0-5 je Dimension.
# Ab der Schwelle wird aus einem Signal eine Feature-Hypothese; darunter wird
# es geshelved — mit Begründung, ohne den CEO zu fragen.
rubrik:
  schwelle: 12
  max_pro_lauf: 8               # Mengen-Deckel; der wirksamste Kostenhebel
  dimensionen:
    nutzen_endanwender:         # Wird eine echte Nutzeraufgabe einfacher?
      gewicht: 2.0
    marktdruck:                 # Setzen Wettbewerber oder Kategoriestandard es voraus?
      gewicht: 1.5
    aufwand_invers:             # Wenig Aufwand = hohe Punktzahl
      gewicht: 1.0
    risiko_invers:              # Wenig Irreversibilität/Bruchgefahr = hohe Punktzahl
      gewicht: 1.0

# --- Führungsebene (Phase 3) -------------------------------------------------
# Wer welches Gate öffnet. Der Supervisor (Mensch) beantwortet das
# Roadmap-Gate und Notfälle; esf-ceo entscheidet Release, Irreversibel und
# Budget über Entscheidungsdokumente (AGENTS.md 7). Kein Modell ruft je
# kanban_unblock — scripts/ceo-tick.sh validiert und führt aus.
fuehrung:
  # schatten: esf-ceo schreibt Entscheidungsdokumente, ausgeführt wird nichts;
  #           der Supervisor antwortet wie bisher. Der Vergleich beider
  #           Antworten (ledger/ceo-entscheidungen.jsonl) ist die Messgröße.
  # live:     scripts/ceo-tick.sh führt gültige CEO-Entscheidungen aus.
  # Umgestellt wird NUR vom Supervisor, am Roadmap-Gate — nie von einem Modell.
  ceo_modus: schatten
  # Deckel für neu angelegte Entscheidungskarten je ceo-tick-Lauf. Ein Modell
  # mit zwölf wartenden Gates winkt genauso durch wie ein Mensch.
  ceo_fragen_pro_tag: 6
  # Gültige CEO-Entscheidungen an Irreversibel-Gates warten diese Frist ab,
  # bevor sie ausgeführt werden. Antwortet der Supervisor vorher selbst über
  # gate.sh, gilt die CEO-Entscheidung als überholt.
  irreversibel_einspruch_stunden: 24
  # Ein Gate, das so lange ohne gültiges Entscheidungsdokument blockiert
  # steht, ist ein Notfall (scripts/eskalation.sh).
  gate_unbeantwortet_stunden: 24
  # melden: die Notfall-Leiter meldet Betriebsmuster nur (Default).
  # auto:   bekannte Betriebsmuster werden EINMAL je Karte selbst repariert
  #         (unblock "manuell: betriebsrettung …"); das zweite Mal ist ein
  #         Notfall.
  betriebsrettung: melden

# --- Budget-Eskalation ------------------------------------------------------
# Reißt ein Feature oder Sprint diesen Anteil seiner P90-Schätzung, geht ein
# Gate an den CEO: Lage, Optionen, Empfehlung.
budget_eskalation_bei: 1.5

# --- Video-Kanal (AGENTS.md 8) ------------------------------------------------
videos:
  # an|aus — scripts/video-render.sh rendert Zusammenfassungen der Dokumente
  # unter analysis/, roadmap/ und reports/ (Sprechertext aus dem Dokument).
  zusammenfassungen: an
  # --- Sprecher-Audio ---
  # openrouter|say. `openrouter` ist der Normalweg: dasselbe Provider-Konto wie
  # die ganze ESF, abgerechnet über den Key des Video-Profils. Der lokale Weg
  # wäre `hyperframes tts` (Kokoro-82M) — er fällt aus, weil Kokoro KEIN Deutsch
  # kennt (gemessen an 0.8.3: en-us, en-gb, es, fr-fr, hi, it, pt-br, ja, zh).
  tts_weg: openrouter
  tts_modell: openai/gpt-audio
  tts_stimme: alloy
  # Die macOS-`say`-Stimme des RÜCKFALLS: ohne Netz, ohne Kosten, hörbar
  # künstlich — aber immer wörtlich. Sie greift auch, wenn das Sprachmodell nicht
  # wörtlich gelesen hat (tts-openrouter.py prüft das gegen sein Transkript).
  stimme: Anna
  # an|aus — Playwright-Videoaufzeichnung nach JEDEM grünen E2E-Lauf, sofort
  # und unabhängig vom Merge (scripts/e2e-video.sh; gerufen vom Merge-Riegel
  # direkt nach Prüfung 6/6, vom Tick, vom Onboarding- und Release-Nachweis).
  # Je Anlass eine eigene Akte unter reports/e2e-videos/<datum>/<anlass>/.
  e2e_aufzeichnung: an
  # Verzoegerung in Millisekunden VOR JEDER Playwright-Aktion waehrend der
  # Aufzeichnung (launchOptions.slowMo der abgeleiteten Config). Ohne sie
  # laeuft die Suite in ihrer Maschinen-Geschwindigkeit, und das Video zeigt
  # Sprünge statt Bedienung — real: 14 Journeys in 1,3 Minuten.
  # Sie wirkt NUR auf den Aufzeichnungslauf. Der Lauf, der ueber den Merge
  # entscheidet, ist ein anderer und bleibt unberuehrt schnell.
  #
  # 900 ist gemessen, nicht geraten (19.08.2026, drei Laeufe derselben Suite):
  #        0 ms   350 ms   900 ms   Suite gesamt
  #   ---------------------------------------------
  #   J-03  5,3 s   8,4 s   15,9 s   68 s -> 112 s -> 204 s
  #   J-06  6,6 s  12,3 s   24,2 s   1,3 min -> 1,9 min -> 3,3 min
  # 350 ms brachte nur ~1,5x — zu wenig zum Mitlesen. 900 ms bringt 2,5–3,5x
  # auf den bedienungsintensiven Journeys. Reine Navigations-Journeys bleiben
  # kurz (2,9 s), weil slowMo nur AKTIONEN verzoegert und nicht Ladezeiten —
  # dort gibt es auch nichts nachzuvollziehen.
  e2e_video_slowmo_ms: 900
  # Dehnungsfaktor fuer `--nachziehen`, also fuer Aufzeichnungen, die es schon
  # gibt. Sie lassen sich nicht nachtraeglich langsamer AUFNEHMEN, nur
  # langsamer ABSPIELEN (ffmpeg setpts). Das ist kein Ersatz: Eine gedehnte
  # Aufnahme zeigt nicht mehr die Zeit, die der Lauf gebraucht hat, und wird
  # deshalb im Index als gedehnt ausgewiesen.
  e2e_video_tempo: 2.5

# --- Das Ziel-Repo ----------------------------------------------------------
produkt:
  name: Kaneo
  repo: /Users/aknipschild/github/hermes-agent-playground/04-hermes-agent-software-company-test-kaneo
  branch_praefix: feat/
  e2e_verzeichnis: tests/e2e/journeys
  # Vorbedingung jedes E2E-Laufs: Postgres im Container.
  e2e_vorbedingung: docker compose -f compose.yml up -d postgres
  # HEADLESS IST PFLICHT — ohne Ausnahme. Ein `--headed` hier oder ein
  # `headless: false` in der Playwright-Config hielte jeden Cron- und
  # Riegel-Lauf auf einem Bildschirm fest, den es dort nicht gibt.
  # Durchgesetzt vom Wächter (scripts/e2e-video.sh --headless-waechter),
  # den merge-riegel.sh und tick.sh vor jedem Lauf ausführen.
  e2e_befehl: pnpm exec playwright test
