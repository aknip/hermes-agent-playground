<!doctype html>
<html lang="de" data-resolution="landscape">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>ESF Video-Zusammenfassung</title>
<!--
  Hyperframes-Komposition der ESF-Video-Zusammenfassungen.

  Gemessen gegen Hyperframes 0.8.3 (18.08.2026): Der Vertrag stammt NICHT aus
  der Online-Doku, sondern aus dem Gerüst von `hyperframes init --example blank`
  und ist mit `hyperframes lint` nachgewiesen. Fünf Pflichten, die eine frühere
  geratene Fassung alle verletzte:

    · Root traegt data-composition-id, data-start, data-duration,
      data-width, data-height
    · die Timeline haengt an window.__timelines[<composition-id>]
    · <audio> braucht src DIREKT am Element (nicht per JS gesetzt)
    · kein performance.now(), kein requestAnimationFrame — beide laufen auf
      Wanduhr und desynchronisieren die Frame-Erfassung
    · Clips sind Kinder mit data-start / data-duration / data-track-index

  Die Platzhalter (je Name in doppelten Unterstrichen: DAUER, AUDIO, TITEL,
  CUE_CLIPS, CUE_TWEENS) ersetzt scripts/video-werkzeug.py `komposition` je
  Job — hier bewusst OHNE die Unterstriche geschrieben, sonst ersetzt die
  Instanziierung sie in diesem Kommentar mit. Die
  Cue-Zeiten kommen aus der GEMESSENEN Audiodauer und erzeugen auch die .vtt —
  Bild, Ton und Untertitel teilen EINE Zeitquelle (AGENTS.md 8).
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden;
               background: #101418; color: #e8eaed;
               font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; }
  #root { position: relative; width: 100%; height: 100%; padding: 96px 132px; }
  .kopf { font-size: 28px; letter-spacing: 0.12em; color: #9aa0a6;
          text-transform: uppercase; }
  h1 { font-size: 66px; line-height: 1.2; margin: 26px 0 0; font-weight: 600;
       max-width: 26em; }
  .cue { position: absolute; left: 132px; right: 132px; top: 46%;
         font-size: 42px; line-height: 1.5; max-width: 24em; }
  .fuss { position: absolute; left: 132px; bottom: 96px;
          font-size: 22px; color: #9aa0a6; }
  .balken { position: absolute; left: 132px; right: 132px; bottom: 64px;
            height: 5px; background: #2a2f36; }
  #fortschritt { height: 100%; width: 0; background: #8ab4f8; }
</style>
</head>
<body>
<div id="root"
     data-composition-id="esf"
     data-start="0"
     data-duration="__DAUER__"
     data-width="1920"
     data-height="1080">
  <div class="kopf">ESF · Video-Zusammenfassung</div>
  <h1 id="titel">__TITEL__</h1>
__CUE_CLIPS__
  <div class="fuss">Sprechertext aus dem Dokument · Untertitel als .vtt daneben</div>
  <div class="balken"><div id="fortschritt"></div></div>
</div>
<audio id="audio" src="__AUDIO__" data-start="0" data-track-index="0" data-volume="1"></audio>
<script>
  // Eine pausierte GSAP-Timeline: Hyperframes setzt sie je Frame auf die
  // Zielzeit, statt sie laufen zu lassen. Deshalb ist das Bild deterministisch
  // und identisch zwischen Preview und Render.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to("#fortschritt", { width: "100%", duration: __DAUER__, ease: "none" }, 0);
__CUE_TWEENS__
  window.__timelines["esf"] = tl;
</script>
</body>
</html>
